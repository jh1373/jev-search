name: Release

# Tagging is deliberate: this workflow packages an artefact and publishes it, so it only runs on a tag
# that names the version in manifest.json. It does not run on a branch push.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck, unit tests, and build
        run: npm run check
      - name: Inspect the release and confirm the tag names the version
        run: node scripts/verify-release.mjs --tag="$GITHUB_REF_NAME"
      - name: Package the three files Obsidian loads
        run: |
          mkdir -p release
          cp dist/main.js dist/manifest.json dist/styles.css release/
          (cd release && zip -r ../jev-search.zip .)
      - name: Inspect the packaged archive
        run: node scripts/verify-release.mjs --tag="$GITHUB_REF_NAME" --zip=jev-search.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Jev Search $GITHUB_REF_NAME" --notes-file CHANGELOG.md jev-search.zip release/main.js release/manifest.json release/styles.css
